[project]
name = "flow-control-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.14.0",
    "linopy>=0.8.0",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
    "pytest>=8.0",
    # devtoolsの依存
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.basedpyright]
include = ["src", "tests", "main.py", "devtools"]

extraPaths = ["src"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingParameterType = false
# テストは内部ヘルパーをホワイトボックス検証で利用する
reportPrivateUsage = false

[[tool.basedpyright.executionEnvironments]]
root = "devtools"
extraPaths = ["src"]
# matplotlib / networkx / yaml は型スタブを提供せず Any 由来の警告が多発するため緩和する
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
# devtools はパッケージ内ヘルパーを相互利用し、開発用途のため文体は緩める
reportPrivateUsage = false
reportImplicitStringConcatenation = false
reportCallInDefaultInitializer = false
