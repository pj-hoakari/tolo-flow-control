# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
    release:
        desc: Create a GitHub release after checking that VERSION is newer than every existing tag.
        requires:
            vars: [VERSION]
        silent: true
        cmds:
            - |
                set -euo pipefail

                TAG="{{.VERSION}}"
                SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
                if ! printf '%s' "${TAG#v}" | grep -Eq "$SEMVER" || [ "${TAG:0:1}" != "v" ]; then
                  echo "usage: task release VERSION=vX.Y.Z（または vX.Y.Z-suffix）。指定値: '${TAG}'" >&2
                  exit 1
                fi

                if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
                  echo "タグ ${TAG} は既にあります" >&2
                  exit 1
                fi

                VERSION="${TAG#v}"
                LATEST="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
                  | sed 's|.*refs/tags/v||' | grep -E "$SEMVER" \
                  | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/' || true)"
                if [ -n "$LATEST" ]; then
                  HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/')"
                  if [ "$HIGHEST" != "$VERSION" ]; then
                    echo "${TAG} は最新のバージョン v${LATEST} より新しくありません" >&2
                    exit 1
                  fi
                fi

                ARGS=(--title "$TAG" --generate-notes)
                case "$VERSION" in
                  *-*) ARGS+=(--prerelease) ;;
                esac

                echo "release ${TAG}（現在の最新: ${LATEST:+v}${LATEST:-なし}）"
                if [ "${DRY_RUN:-}" = "1" ]; then
                  exit 0
                fi
                gh release create "$TAG" "${ARGS[@]}"

    proto:
        desc: Lint proto and regenerate Python code.
        cmds:
            - task: proto:lint
            - task: proto:gen

    proto:lint:
        desc: Lint and build proto.
        cmds:
            - buf lint
            - buf build

    proto:gen:
        desc: Regenerate Python code from proto.
        cmds:
            - buf generate --template buf.gen.python.yaml

    proto:gen:check:
        desc: Check that the generated Python code is up to date.
        cmds:
            - task: proto:gen
            - |
                if [ -n "$(git status --porcelain -- src/flow_control/rpc/generated)" ]; then
                    echo "::error::buf generate の出力がコミット済みの生成コードと一致しません"
                    git status --porcelain -- src/flow_control/rpc/generated
                    git diff -- src/flow_control/rpc/generated
                    exit 1
                fi

    proto:dist:check:
        desc: Check that the distributable proto file set builds on its own.
        cmds:
            - |
                WORK="$(mktemp -d)"
                cd proto
                find . -type f -name '*.proto' | sed 's|^\./||' | sort >"$WORK/files"
                COUNT="$(wc -l <"$WORK/files" | tr -d ' ')"
                if [ "$COUNT" -eq 0 ]; then
                    echo "::error::配布対象の .proto ファイルが見つかりません"
                    exit 1
                fi
                while IFS= read -r f; do
                    mkdir -p "$WORK/proto/$(dirname "$f")"
                    cp "$f" "$WORK/proto/$f"
                done <"$WORK/files"
                echo "配布用ファイル集合: ${COUNT} file(s)"
                printf 'version: v2\nmodules:\n  - path: proto\n' >"$WORK/buf.yaml"
                cd "$WORK"
                buf build
