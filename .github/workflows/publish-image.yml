name: Publish Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        uses: pj-hoakari/actions/resolve-version@3cf99dacd5f2b5135f15ce80118d9647dbae6a2d # v20261002

      - name: Build and push
        uses: pj-hoakari/actions/publish-image@3cf99dacd5f2b5135f15ce80118d9647dbae6a2d # v20261002
        with:
          version: ${{ steps.version.outputs.version }}
