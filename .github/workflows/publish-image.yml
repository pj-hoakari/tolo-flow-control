name: Publish Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        uses: pj-hoakari/actions/resolve-version@d5a03071134d13698e42b2afbf9ae1761ea64ca6 # v20261017.0.0

      - name: Build and push
        uses: pj-hoakari/actions/publish-image@d5a03071134d13698e42b2afbf9ae1761ea64ca6 # v20261017.0.0
        with:
          version: ${{ steps.version.outputs.version }}
