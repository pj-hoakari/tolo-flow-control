name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "公開するバージョン（先頭 v 必須。vX.Y.Z または vX.Y.Z-suffix）"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROTO_NAME: ${{ github.repository }}-proto
  ARTIFACT_TYPE: application/vnd.protobuf
  LAYER_MEDIA_TYPE: application/vnd.protobuf
  BUF_VERSION: 1.73.0

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version, commit and tags
        id: resolve
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! printf '%s' "$RAW_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::想定外のタグ/バージョン形式: '${RAW_VERSION}'（先頭 v 必須。vX.Y.Z または vX.Y.Z-suffix。例: v0.1.0, v0.1.0-rc）"
            exit 1
          fi

          VERSION="${RAW_VERSION#v}"
          TAG="$RAW_VERSION"
          SHA="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || true)"
          if [ -z "$SHA" ]; then
            echo "::error::タグ ${TAG} がリポジトリに存在しません。公開対象は既存 release タグの commit に限ります"
            exit 1
          fi

          case "$VERSION" in
          *-*) IS_PRERELEASE=true ;;
          *) IS_PRERELEASE=false ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$RELEASE_PRERELEASE" != "$IS_PRERELEASE" ]; then
            echo "::error::release の prerelease 設定 (${RELEASE_PRERELEASE}) と version '${VERSION}' の表記が矛盾します"
            exit 1
          fi

          TAGS="$(git tag -l 'v*' | bash .github/scripts/release_tags.sh "$VERSION" | paste -sd, -)"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "tags=${TAGS}"
          } >>"$GITHUB_OUTPUT"
          echo "version: ${VERSION} / commit: ${SHA} / tags: ${TAGS}"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  image:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: exists
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          REF="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          if DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${REF} は既に存在するため push をスキップします（digest: ${DIGEST}）"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build image tag list
        id: tags
        if: steps.exists.outputs.exists == 'false'
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          {
            echo 'tags<<TAGS_EOF'
            printf '%s\n' "$TAGS" | tr ',' '\n' | sed "s|^|${REGISTRY}/${IMAGE_NAME}:|"
            echo 'TAGS_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
          provenance: true
          sbom: true

      - name: Resolve image digest
        id: digest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          REF="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          echo "digest=${DIGEST}" >>"$GITHUB_OUTPUT"
          echo "image: ${REF} (${DIGEST})"

  proto:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Check for existing proto artifact
        id: exists
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          REF="${REGISTRY}/${PROTO_NAME}:${VERSION}"
          if DESC="$(oras manifest fetch --descriptor "$REF" 2>/dev/null)"; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${REF} は既に存在するため push をスキップします（digest: $(printf '%s' "$DESC" | jq -r .digest)）"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Push proto artifact
        if: steps.exists.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAGS: ${{ needs.resolve.outputs.tags }}
          REVISION: ${{ needs.resolve.outputs.sha }}
        run: |
          cd proto

          mapfile -t FILES < <(find . -type f -name '*.proto' | sed 's|^\./||' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::公開対象の .proto ファイルが見つかりません"
            exit 1
          fi

          FILE_ARGS=()
          for f in "${FILES[@]}"; do
            FILE_ARGS+=("${f}:${LAYER_MEDIA_TYPE}")
          done

          echo "publishing ${#FILES[@]} proto file(s):"
          printf '  %s\n' "${FILES[@]}"

          oras push \
            --artifact-type "$ARTIFACT_TYPE" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            "${REGISTRY}/${PROTO_NAME}:${TAGS}" \
            "${FILE_ARGS[@]}"

      - name: Resolve proto digest
        id: digest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          REF="${REGISTRY}/${PROTO_NAME}:${VERSION}"
          DIGEST="$(oras manifest fetch --descriptor "$REF" | jq -r .digest)"
          echo "digest=${DIGEST}" >>"$GITHUB_OUTPUT"
          echo "proto: ${REF} (${DIGEST})"

      - name: Verify published proto artifact
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          WORK="$(mktemp -d)"
          oras pull "${REGISTRY}/${PROTO_NAME}@${DIGEST}" -o "$WORK/proto"
          printf 'version: v2\nmodules:\n  - path: proto\n' >"$WORK/buf.yaml"
          cd "$WORK"
          find proto -type f -name '*.proto' | sort
          buf build

  summary:
    needs: [resolve, image, proto]
    runs-on: ubuntu-24.04
    steps:
      - name: Write publish summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
          TAGS: ${{ needs.resolve.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          PROTO_DIGEST: ${{ needs.proto.outputs.digest }}
        run: |
          {
            echo "## Publish ${VERSION}"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| version | \`${VERSION}\` |"
            echo "| commit | \`${COMMIT}\` |"
            echo "| tags | \`${TAGS}\` |"
            echo "| image | \`${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}\` |"
            echo "| proto | \`${REGISTRY}/${PROTO_NAME}@${PROTO_DIGEST}\` |"
          } >>"$GITHUB_STEP_SUMMARY"
