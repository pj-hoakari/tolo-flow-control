name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      ref:
        description: "検証対象の ref（空なら既定の checkout）"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Buf lint and build
        run: task proto:lint

      - name: Check generated code is up to date
        run: task proto:gen:check

      - name: Verify distributable proto file set
        run: task proto:dist:check

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest
        run: uv run pytest

      - name: Test release tag script
        run: bash .github/scripts/release_tags_test.sh

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            scope: image-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: image-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: tolo-flow-control:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Start container
        run: |
          docker run -d --name flow-control-smoke \
            --read-only --tmpfs /tmp \
            -p 18080:8080 \
            tolo-flow-control:ci

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::コンテナが /readyz に応答しません"
          exit 1

      - name: Run container smoke test
        env:
          TOLO_SMOKE_BASE_URL: http://127.0.0.1:18080
        run: uv run pytest tests/rpc/test_container_smoke.py

      - name: Dump container logs
        if: failure()
        run: docker logs flow-control-smoke
