name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check generated code
        uses: pj-hoakari/actions/proto-check@c61d08b3baf77fa710bcea9849e1c88540fd1248 # v20261003.0.0
        with:
          generate-task: proto:gen
          generated-path: src/flow_control/rpc/generated

      - name: Verify distributable proto file set
        run: task proto:dist:check

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python code
        uses: pj-hoakari/actions/python/check@c61d08b3baf77fa710bcea9849e1c88540fd1248 # v20261003.0.0

  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  container:
    if: github.base_ref == 'main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            scope: image-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: image-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: tolo-flow-control:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Start container
        run: |
          docker run -d --name flow-control-smoke \
            --read-only --tmpfs /tmp \
            -p 18080:8080 \
            tolo-flow-control:ci

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::コンテナが /readyz に応答しません"
          exit 1

      - name: Run container smoke test
        env:
          TOLO_SMOKE_BASE_URL: http://127.0.0.1:18080
        run: uv run pytest tests/rpc/test_container_smoke.py

      - name: Dump container logs
        if: failure()
        run: docker logs flow-control-smoke
