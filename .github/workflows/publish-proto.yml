name: Publish Proto Artifact

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  ARTIFACT_NAME: ${{ github.repository }}-proto
  ARTIFACT_TYPE: application/vnd.protobuf
  LAYER_MEDIA_TYPE: application/vnd.protobuf

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Push proto artifact
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="${VERSION},sha-${GITHUB_SHA::7}"
          case "$VERSION" in
          *-*) ;;
          *) TAGS="${TAGS},latest" ;;
          esac

          cd proto

          mapfile -t FILES < <(find . -type f -name '*.proto' | sed 's|^\./||' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::公開対象の .proto ファイルが見つかりません"
            exit 1
          fi

          FILE_ARGS=()
          for f in "${FILES[@]}"; do
            FILE_ARGS+=("${f}:${LAYER_MEDIA_TYPE}")
          done

          echo "publishing ${#FILES[@]} proto file(s) (tags: ${TAGS}):"
          printf '  %s\n' "${FILES[@]}"

          oras push \
            --artifact-type "$ARTIFACT_TYPE" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${REGISTRY}/${ARTIFACT_NAME}:${TAGS}" \
            "${FILE_ARGS[@]}"
