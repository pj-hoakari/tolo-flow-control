name: Publish Proto Artifact

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and tags
        id: version
        uses: pj-hoakari/actions/resolve-version@3cf99dacd5f2b5135f15ce80118d9647dbae6a2d # v20261002

      - name: Push proto artifact
        uses: pj-hoakari/actions/publish-proto@3cf99dacd5f2b5135f15ce80118d9647dbae6a2d # v20261002
        with:
          version: ${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
